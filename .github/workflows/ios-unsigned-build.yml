name: Build unsigned iOS app

# Xcode only runs on macOS, so this one step has to happen on a macOS
# runner. Everything downstream of it (signing, installing on-device) is
# done separately on NixOS -- see app/ios/README-sideload.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ios-unsigned-build.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ChristmasLight-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ChristmasLight-unsigned.ipa
          path: app/build/ios/iphoneos/ChristmasLight-unsigned.ipa
          retention-days: 14
